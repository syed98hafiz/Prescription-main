name: Deploy Supabase Migrations

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets availability
        id: check
        env:
          HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          HAS_DB_PW: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$HAS_TOKEN" ] || [ -z "$HAS_DB_PW" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping automated CLI push: add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD secrets (or connect Supabase native GitHub Integration)."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        if: steps.check.outputs.enabled == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link & Push Migrations to Supabase
        if: steps.check.outputs.enabled == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref voczhrkycygwquxqswxx
          supabase db push --yes
